name: Release

# A cada CI verde na branch principal: compila os instaladores do Windows e
# anexa-os à execução como artefatos SOLTOS (sem zip).
# Auto-release: se a versão do app (tauri.conf.json) ainda não tem release,
# também PUBLICA o release (os launchers instalados se atualizam sozinhos).
# Para lançar uma versão: npm run release X.Y.Z, commit e push.
#
# Também roda por tag vX.Y.Z (publica) ou manualmente em Actions → Release →
# Run workflow (cria/atualiza um RASCUNHO, para testar antes).
#
# O instalador também fica nos "Artifacts" de cada execução.
#
# Atualização automática assinada (configure uma vez, veja o README):
#   secret   TAURI_SIGNING_PRIVATE_KEY           chave privada
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  senha da chave
#   variable TAURI_UPDATER_PUBKEY                chave pública
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador do Windows
    runs-on: windows-latest
    # pela CI: só quando passou, num push na branch principal
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Versão e modo de publicação
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # rascunho só quando rodado à mão; pela CI ou por tag, publica direto
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "draft=true" >> "$GITHUB_OUTPUT"; else echo "draft=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $version do app. Rode: npm run release ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          # pela CI: só publica se essa versão ainda não tem release (publicado ou rascunho);
          # os instaladores são compilados e anexados como artefatos de qualquer jeito
          publish=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | grep -qx "v$version"; then
              publish=false
              echo "::notice::A versão v$version já tem release: só os artefatos serão gerados. Para lançar outra, rode npm run release <nova versão> e faça push."
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - name: Dependências do npm
        run: npm ci

      - name: Atualização automática (assinatura)
        id: signing
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e "
              const pubkey = process.env.PUBKEY.trim();
              const conf = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey } } };
              require('fs').writeFileSync('src-tauri/updater.conf.json', JSON.stringify(conf));
            "
            echo "args=--config src-tauri/updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "Atualização automática: ligada."
          else
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY/TAURI_UPDATER_PUBKEY: o instalador sai sem atualização automática."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compila e publica o release
        id: tauri
        if: steps.meta.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Forbidden Series Launcher v__VERSION__
          releaseCommitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          releaseBody: |
            Baixe **ForbiddenSeries-Setup-${{ steps.meta.outputs.version }}.exe** abaixo e instale. Na primeira vez que clicar em JOGAR, o launcher baixa o Java, o Minecraft 1.7.10 e a versão mais nova do modpack.

            Quem já tem o launcher recebe esta versão sozinho (aviso no topo da janela).
          releaseDraft: ${{ steps.meta.outputs.draft }}
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis ${{ steps.signing.outputs.args }}

      - name: Compila (sem publicar)
        if: steps.meta.outputs.publish != 'true'
        shell: bash
        env:
          ARGS: ${{ steps.signing.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          npx tauri build --bundles nsis $ARGS

      # instalador com o visual da marca, com o instalador oficial embutido
      # (o oficial continua no release: é ele que a atualização automática usa)
      - name: Instalador com o visual da marca
        id: setup
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          export FORBIDDEN_LAUNCHER_INSTALLER="$PWD/${files[0]}"
          export FORBIDDEN_LAUNCHER_VERSION="$VERSION"
          (cd installer && npx tauri build --no-bundle)
          out="ForbiddenSeries-Setup-$VERSION.exe"
          cp installer/src-tauri/target/release/forbidden-setup.exe "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publica o instalador no release
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          FILE: ${{ steps.setup.outputs.file }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          # sobe pelo id do release (funciona também com rascunho); troca se já existir
          name=$(basename "$FILE")
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$name\") | .id")
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
            -H "Content-Type: application/octet-stream" --input "$FILE" --jq .browser_download_url

      # artefatos soltos (sem zip): um por arquivo
      - name: Localiza os arquivos
        id: files
        shell: bash
        run: |
          nsis=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          echo "nsis=${nsis[0]}" >> "$GITHUB_OUTPUT"
          if [ -f "${nsis[0]}.sig" ]; then echo "sig=${nsis[0]}.sig" >> "$GITHUB_OUTPUT"; fi

      - name: Artefato · instalador (visual da marca)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.setup.outputs.file }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Artefato · instalador oficial (NSIS)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.nsis }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Artefato · assinatura da atualização
        if: steps.files.outputs.sig != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.files.outputs.sig }}
          archive: false
          if-no-files-found: error
          retention-days: 30

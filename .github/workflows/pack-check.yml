name: Modpack publicado

# Confere o release TEOF mais novo publicado em Akashiic/Technic-Forbidden:
# lê só o índice do .zip (~200 KB) e verifica que o launcher coloca os mods em
# mods/ (e acha o Forge em bin/modpack.jar). A estrutura do .zip aparece no log.
# Separado da CI para não bloquear os releases do launcher.
on:
  push:
    branches: ['**']
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: pack-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Formato do release TEOF mais novo
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Tauri no Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Interface vazia (o teste não precisa dela)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Confere o pack publicado
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -- --ignored --nocapture release_mais_novo

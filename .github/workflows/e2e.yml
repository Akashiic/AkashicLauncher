name: Teste completo

# O mesmo fluxo do botão JOGAR, com o release TEOF real: baixa Java, Minecraft
# 1.7.10 e o modpack, abre o jogo numa tela virtual e só passa se o Forge
# identificar os mods do pack (o Forge puro mostra só 3). Os logs do jogo ficam
# nos artefatos da execução.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jogar:
    name: JOGAR com o pack publicado
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Tauri, tela virtual e OpenGL por software)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb x11-xserver-utils libgl1-mesa-dri libxtst6 libxi6 libxrender1 libxext6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e

      - name: Interface vazia (o teste não precisa dela)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: JOGAR (instala tudo e abre o Minecraft)
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_DATA_HOME: ${{ runner.temp }}/dados
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -- --ignored --nocapture jogar_instala_o_pack

      - name: Logs do jogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teste-completo-logs
          path: |
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/logs/
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/crash-reports/
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/.forbidden/pack.json
          if-no-files-found: warn
          retention-days: 14

  # PC fraco: OpenGL limitado a 3.1 (como a Intel HD 2000 de 2011). Sem o modo
  # compatibilidade tem que dar o crash do Angelica; com ele, o jogo tem que
  # carregar todos os mods.
  opengl31:
    name: PC fraco (OpenGL 3.1) · ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sem modo compatibilidade
            compat: '0'
            expect: crash
          - name: com modo compatibilidade
            compat: '1'
            expect: load
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Tauri, tela virtual e OpenGL por software)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb x11-xserver-utils libgl1-mesa-dri libxtst6 libxi6 libxrender1 libxext6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e

      - name: Interface vazia (o teste não precisa dela)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      # NeoStates com a correção para rodar sem o Angelica (ainda fora do pack publicado)
      - name: NeoStates da branch de correção
        if: matrix.compat == '1'
        uses: actions/checkout@v5
        with:
          repository: Akashiic/Neo-States
          ref: claude/sem-angelica-dragonapi
          path: neo-states
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: matrix.compat == '1'
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.compat == '1'

      - name: Compila o NeoStates
        if: matrix.compat == '1'
        working-directory: neo-states
        env:
          VERSION: 0.1.0-alpha.11-teste
        run: |
          ./gradlew build -x javadoc -x test -x spotlessCheck --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          jar="$PWD/build/libs/NeoStates-$VERSION.jar"
          test -f "$jar"
          echo "FORBIDDEN_E2E_REPLACE_MOD=NeoStates-=$jar" >> "$GITHUB_ENV"

      - name: JOGAR com OpenGL 3.1
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_DATA_HOME: ${{ runner.temp }}/dados
          MESA_GL_VERSION_OVERRIDE: '3.1'
          MESA_GLSL_VERSION_OVERRIDE: '140'
          FORBIDDEN_E2E_COMPAT: ${{ matrix.compat }}
          FORBIDDEN_E2E_GL31: ${{ matrix.expect }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -- --ignored --nocapture jogar_instala_o_pack

      - name: Logs do jogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opengl31-${{ matrix.compat }}-logs
          path: |
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/logs/
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/crash-reports/
          if-no-files-found: warn
          retention-days: 14

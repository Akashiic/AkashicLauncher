name: Teste completo

# O mesmo fluxo do botão JOGAR, com o release TEOF real: baixa Java, Minecraft
# 1.7.10 e o modpack, abre o jogo numa tela virtual e só passa se o Forge
# identificar os mods do pack (o Forge puro mostra só 3). Os logs do jogo ficam
# nos artefatos da execução.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jogar:
    name: JOGAR com o pack publicado
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Tauri, tela virtual e OpenGL por software)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb x11-xserver-utils libgl1-mesa-dri libxtst6 libxi6 libxrender1 libxext6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e

      - name: Interface vazia (o teste não precisa dela)
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: JOGAR (instala tudo e abre o Minecraft)
        working-directory: src-tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XDG_DATA_HOME: ${{ runner.temp }}/dados
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test -- --ignored --nocapture jogar_instala_o_pack

      - name: Logs do jogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teste-completo-logs
          path: |
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/logs/
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/crash-reports/
            ${{ runner.temp }}/dados/.forbiddenseries/instances/forbidden/.forbidden/pack.json
          if-no-files-found: warn
          retention-days: 14

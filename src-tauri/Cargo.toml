[package]
name = "forbidden-launcher"
version = "0.1.0"
description = "Launcher do Forbidden Series (Minecraft 1.7.10 Modded)"
edition = "2021"
publish = false

[lib]
name = "forbidden_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "http2"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rand = "0.8"

# binário pequeno e rápido de carregar
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
